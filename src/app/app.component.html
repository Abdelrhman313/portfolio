<app-preloader
  *ngIf="showPreloader"
  [initials]="profile.initials"
  avatar="assets/images/avatar-sm.webp"
  (finished)="showPreloader = false"
/>
<app-scroll-progress />
<app-custom-cursor />
<a href="#main-content" class="skip-link">Skip to content</a>

<div class="site-bg">
  <app-section-rail />
  <app-site-nav [initials]="profile.initials" />
  <main id="main-content">
    <app-hero />
    <app-about />
    <app-experience />
    <app-projects />
    <app-skills />
    <app-contact />
  </main>
  <app-site-footer [socials]="profile.socials" [email]="profile.email" />
  <app-toaster />
</div>
