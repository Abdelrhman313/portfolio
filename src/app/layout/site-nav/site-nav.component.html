<div class="nav-wrap">
  <nav class="nav" #nav aria-label="Main navigation">
    <a href="#hero" class="nav__logo">
      <span class="nav__initials">{{ initials }}</span>
      <span class="nav__divider"></span>
      <span class="nav__brand">Portfolio</span>
    </a>
    <ul class="nav__list" role="list">
      <li class="nav__li" *ngFor="let item of items">
        <div class="nav__item" #item>
          <div class="nav__glow"></div>
          <a
            class="nav__link nav__link--front"
            [href]="'#' + item.id"
            [class.is-active]="active === item.id"
            [attr.aria-current]="active === item.id ? 'true' : null"
            [attr.aria-label]="item.label"
          >
            <span class="nav__icon"><app-icon [name]="item.icon" /></span>
            <span class="nav__label">{{ item.label }}</span>
          </a>
          <a class="nav__link nav__link--back" [href]="'#' + item.id" tabindex="-1" aria-hidden="true">
            <span class="nav__icon"><app-icon [name]="item.icon" /></span>
            <span class="nav__label">{{ item.label }}</span>
          </a>
        </div>
        <span class="nav__indicator" #indicator></span>
      </li>
    </ul>
  </nav>
</div>
